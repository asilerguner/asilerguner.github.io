<style>
body.locked .nav-toggle { display: none; }
.cw-lock { min-height: 72vh; display: grid; place-items: center; padding: 48px 0; }
.cw-lock-card { background: #fff; border-radius: var(--radius); box-shadow: 0 24px 60px rgba(0,0,0,0.3); padding: 40px 34px; width: min(420px, 100%); text-align: center; }
.cw-lock-ico { width: 56px; height: 56px; margin: 0 auto 18px; border-radius: 16px; display: grid; place-items: center; background: linear-gradient(135deg, rgba(0,160,200,0.14), rgba(0,40,80,0.10)); color: var(--cyan); }
.cw-lock-ico svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.cw-lock-card h1 { font-size: 1.5rem; margin-bottom: 6px; }
.cw-lock-card p { color: var(--muted); font-size: 0.95rem; margin-bottom: 20px; }
.cw-lock-card input { width: 100%; font: inherit; padding: 13px 16px; border: 1px solid var(--divider); border-radius: 999px; text-align: center; margin-bottom: 12px; }
.cw-lock-card input:focus { outline: 2px solid var(--cyan); border-color: transparent; }
.cw-lock-card button { width: 100%; border: 0; cursor: pointer; }
.cw-lock-err { color: #c0392b; font-size: 0.88rem; min-height: 1.3em; margin: 10px 0 0; }
</style>
